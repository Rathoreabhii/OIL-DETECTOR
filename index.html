<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maritime Environment</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #061018;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #061018;
        color: #d7e6f2;
        z-index: 10;
        letter-spacing: 0.08em;
        gap: 14px;
      }
      #loader .label {
        font-size: 12px;
        text-transform: uppercase;
        opacity: 0.85;
      }
      #loader .bar {
        width: 180px;
        height: 2px;
        background: #1a2e3c;
        overflow: hidden;
      }
      #loader .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        background: #c9e4f7;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(350%); }
      }
      #hint {
        position: fixed;
        left: 16px;
        bottom: 14px;
        color: rgba(230, 240, 248, 0.55);
        font-size: 11px;
        pointer-events: none;
        z-index: 2;
      }
      #error {
        display: none;
        position: fixed;
        inset: 24px;
        z-index: 20;
        background: #1a0f10;
        color: #ffd0d0;
        padding: 20px;
        overflow: auto;
        white-space: pre-wrap;
        font: 12px/1.45 ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="label">Building ocean spectrum</div>
      <div class="bar"><i></i></div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="error"></div>
    <div id="hint">LMB orbit · RMB pan · wheel zoom · Current: speed / direction</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
